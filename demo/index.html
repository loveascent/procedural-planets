)/Δ"},{k:"detail",mode:"plus",min:0,max:2.5,step:.01,label:l("Feindetail","Fine detail"),help:l("Weitere Oktaven, live im Pixel gerechnet: beim Heranzoomen wird die Oberfläche immer feiner, ohne Pixelblöcke.","More octaves computed live per pixel: zooming in keeps adding detail, without pixel blocks."),fx:"Σ_{f > N/2π} snoise(f·p)·A/f,  "+l("ausgeblendet unter 3 px","faded below 3 px")},{k:"shadows",mode:"plus",min:0,max:1,step:.01,label:l("Geländeschatten","Terrain shadows"),help:l("Berge werfen Schatten, bei flacher Sonne lang. Der Strahl zur Sonne wird über die Höhenkarte verfolgt.","Mountains cast shadows, long at low sun. The ray to the sun is traced over the height map."),fx:l("Schatten, wenn z(q) > z₀ + s·tan ε + s²/2","shadow if z(q) > z₀ + s·tan ε + s²/2")}]},{id:"material",title:"Material",items:[{k:"rough",mode:"orig",min:0,max:1,step:.01,label:"roughness",help:l("Wie im Original. Die Rauigkeits-Karte (Land hoch, Wasser niedrig) wird damit multipliziert.","As in the original. The roughness map (land high, water low) is multiplied by it."),fx:"α = (roughness·map)²,  D_GGX = α²/(π((n·h)²(α²−1)+1)²)"},{k:"metal",mode:"orig",min:0,max:1,step:.01,label:"metalness",help:l("Wie im Original: dieselbe Karte dient auch als Metall-Karte. Deshalb glänzt das Land dort metallisch.","As in the original: the same map also serves as metalness map. That is why the land has a metallic sheen."),fx:"F₀ = mix(0,04; Albedo; metalness·map)"},{k:"gloss",mode:"plus",min:0,max:1,step:.01,label:l("Glanz (Land)","Gloss (land)"),help:l("Glanzlichter auf Fels und Hängen. Wasser glänzt immer nach seiner eigenen Physik.","Highlights on rock and slopes. Water always shines by its own physics."),fx:"α_Land = α_Material·(1 − 0,55·Glanz)"}]},{id:"light",title:l("Licht","Lighting"),items:[{k:"sunAz",min:-180,max:180,step:1,label:l("Sonne: Richtung","Sun: direction"),fmt:e=>`${Math.round(e)}°`,help:l("Seitliches Licht zeigt das Relief am stärksten. Der Planet dreht sich, die Sonne steht fest." fn dichotAxis() -> vec3f { return sphPoint(hash33(vec3f(gseed() * 0.31 + 4.0, 9.1, 2.6))); }
fn h_gelaende(s: ptr<function, Surf>, d: vec3f, lv: i32) {
  let sd = gseed();
  var p = d * $gelaende_frq + vec3f(sd * 0.17, 3.3, 1.9);
  if ($gelaende_warp > 0.0) {
    let w = vec3f(snoise(p * 0.7 + 11.0), snoise(p * 0.7 + 27.0), snoise(p * 0.7 + 43.0));
    p += w * $gelaende_warp * 0.7;
  }
  let oct = i32($gelaende_oktaven);
  let nf = fbmG(p, oct, $gelaende_rauh).x;
  let rg = (ridgeN(p * 0.9 + 5.0, oct) - 0.45) * 2.0;
  let n = mix(nf, rg, $gelaende_grat);
  let ax = dichotAxis();
  let dich = dot(d, ax);
  var h = $gelaende_hoehe * n;
  h -= $gelaende_hoehe * 0.7 * $gelaende_dichot * dich;
  // Tieflandpotenzial 0…1: großräumiges Rauschen, gegenüber der Höhe leicht gegenläufig, plus Vorderseitenneigung
  let low = 0.5 + 0.5 * snoise(d * 1.35 + vec3f(sd * 0.07, 8.0, 2.0)) * $gelaende_tiefland;
  (*s).low = clamp(low - 0.38 * $gelaende_dichot * dich - 0.25 * n, 0.0, 1.0);
  (*s).h += h;
}
`,h:{gelaende:"h_gelaende"}},ko={id:"einschlaege",de:"Große Einschläge (Becken, Strahlen)",en:"Large impacts (basins, rays)",gruppe:"relief",an:!0,note:["Einzelne riesige Becken mit Ringen und Auswurf; die jungen haben Strahlen über die halbe Welt.","A few huge basins with rings and ejecta; the young ones have rays across half the world."],par:[P("anz","Anzahl","Count",0,14,1,7,"Wie viele große Einschläge. Der Erdmond hat ~30 Becken über 300 km, Mimas eines (Herschel), Callisto die Mehrringstruktur Valhalla.","How many large impacts. The Moon has ~30 basins over 300 km, Mimas one (Herschel), Callisto the multi-ring structure Valhalla."),P("gross","Größter Radius","Largest radius",.08,.8,.005,.3,"Radius des größten Beckens (Bogenmaß). 0,3 ≈ 1 700 km Durchmesser beim Mond (wie Südpol–Aitken). Herschel auf Mimas: 0,35.","Radius of the largest basin (radians). 0.3 ≈ 1,700 km diameter on the Moon (like South Pole–Aitken). Herschel on Mimas: 0.35."),P("klein","Kleinster Radius","Smallest radius",.02,.3,.005,.07,"Radius des kleinsten Einzeleinschlags.","Radius of the smallest single impact."),P("tiefe","Tiefe","Depth",0,.1,.001,.028,"Tiefe des größten Beckens in Radien des Mondes (0,028 ≈ 48 km).","Depth of the largest basin in moon radii (0.028 ≈ 48 km)."),P("ringe","Ringe","Rings",0,1.5,.01,.8,"Stärke der konzentrischen Ringgebirge und Steilstufen (Mehrringbecken).","Strength of the concentric ring mountains and scarps (multi-ring basins)."),P("auswurf","Auswurf","Ejecta",0,2.5,.01,1,"Dicke der Auswurfdecke und der Randwulst.","Thickness of the ejecta blanket and rim wall."),P("jung","Junge Becken","Young basins",0,1,.01,.4,"Anteil der Einschläge mit frischem, scharfem Relief und Strahlen.","Fraction of impacts with fresh sharp relief and rays."),P("strahlen","Strahlen","Rays",0,2,.01,1,"Helligkeit der Strahlensysteme junger Einschläge.","Brightness of the ray systems of young impacts."),P("laenge","Strahlenlänge","Ray length",2,14,.1,8,"Reichweite der Strahlen in Kraterradien.","Reach of the rays in crater radii."),P("flut","Flutungsneigung","Flooding bias",0,1.5,.01,1,"Wie stark Becken das Tieflandpotenzial erhöhen und damit später von Lava gefüllt werden.","How strongly basins raise the lowland potential and are thus filled by lava later.")],wgsl:`
struct Imp { c: vec3f, R: f32, age: f32, id: f32 }
fn impact(i: i32) -> Imp {
  let sd = gseed();
  let hv = hash33(vec3f(f32(i) * 1.731 + 0.5, sd * 0.37 + 11.0, 3.3));
  let h2 = hash33(vec3f(f32(i) * 2.917 + 4.0, sd * 0.53 + 2.0, 8.1));
  var m: Imp;
  m.c = sphPoint(hv);
  m.R = mix($einschlaege_klein, $einschlaege_gross, pow(h2.x, 2.4));
  if (i == 0) { m.R = $einschlaege_gross; }
  m.age = select(0.3 + 0.7 * h2.y, 0.25 * h2.y, h2.z < $einschlaege_jung);
  m.id = f32(i);
  return m;
}
fn h_einschlaege(s: ptr<function, Surf>, d: vec3f, lv: i32) {
  let n = i32($einschlaege_anz);
  var h = (*s).h;
  var low = (*s).low;
  var cav = (*s).cav;
  for (var i = 0; i < 14; i++) {
    if (i >= n) { break; }
    let m = impact(i);
    let th = angDist(d, m.c);
    if (th > m.R * 3.6) { continue; }
    var x = th / m.R;
    x *= 1.0 + 0.05 * snoise(d * (3.0 / m.R) + vec3f(m.id * 3.1, 1.0, 2.0));
    let rel = m.R / $einschlaege_gross;
    let dep = $einschlaege_tiefe * pow(rel, 0.7) * (1.0 - 0.45 * m.age);
    var hh = 0.0;
    if (x < 1.0) {
      let wall = sstep(0.55, 1.0, x);
      hh = -dep * (1.0 - pow(wall, 1.4));
      hh += $einschlaege_ringe * dep * 0.32 * exp(-sq2((x - 0.42) / 0.07)) * (1.0 - 0.5 * m.age);
      hh += $einschlaege_auswurf * dep * 0.18 * exp(-sq2((1.0 - x) / 0.07));
    } else {
      let fade = 1.0 - sstep(2.4, 3.5, x);
      hh = $einschlaege_auswurf * dep * 0.18 * pow(1.0 / x, 3.0) * fade * (1.0 - 0.4 * m.age);
      // Außenringe als nach außen abfallende Stufen (Cordillera, Rook)
      for (var r = 0; r < 2; r++) {
        let xr = 1.0 + 0.55 * f32(r + 1) + 0.1 * f32(r);
        let u = (x - xr) / 0.06;
        hh += $einschlaege_ringe * dep * (0.30 - 0.12 * f32(r)) * (1.0 - 0.6 * m.age) * (exp(-u * u) - 0.9 * sstep(-0.5, 2.0, u) * exp(-0.12 * u * u) * 0.0);
      }
    }
    h = (h - (*s).form) * (1.0 - 0.9 * (1.0 - sstep(0.7, 1.0, x))) + (*s).form + hh;
    low += $einschlaege_flut * 0.85 * (1.0 - sstep(0.55, 1.1, x));
    cav = max(cav, 1.0 - sstep(0.8, 1.0, x));
  }
  (*s).h = h; (*s).low = clamp(low, 0.0, 1.0); (*s).cav = cav;
}
fn c_einschlaege(s: ptr<function, Surf>, d: vec3f, g: vec3f) {
  let n = i32($einschlaege_anz);
  var br = 0.0;
  for (var i = 0; i < 14; i++) {
    if (i >= n) { break; }
    let m = impact(i);
    if (m.age > 0.25) { continue; }
    let th = angDist(d, m.c);
    let x = th / m.R;
    if (x < 0.98 || x > $einschlaege_laenge) { continue; }
    let te = tangents(m.c);
    let v = d - m.c;
    let ang = atan2(dot(v, te[1]), dot(v, te[0]));
    let nr = 11.0 + floor(hash13(vec3f(m.id, gseed(), 5.0)) * 12.0);
    let lane = snoise(vec3f(ang * 2.1 + m.id * 9.0, x * 0.6, 1.0));
    let pat = pow(clamp(0.5 + 0.5 * sin(ang * nr + 2.2 * lane + m.id * 13.0), 0.0, 1.0), 4.0);
    let fall = pow(1.0 / x, 1.3) * (1.0 - sstep(0.6 * $einschlaege_laenge, $einschlaege_laenge, x));
    let rim = (1.0 - sstep(1.0, 2.2, x));
    br = max(br, (pat * fall * 1.4 + rim * 0.8) * (1.0 - m.age / 0.25 * 0.5));
  }
  (*s).col *= 1.0 + $einschlaege_strahlen * 1.4 * br;
}
`,h:{becken:"h_einschlaege"},c:"c_einschlaege",corder:22},yo={id:"krater",de:"Krater (Einschläge)",en:"Craters (impacts)",gruppe:"relief",an:!0,note:["Tausende Krater in allen Größen: Schüsseln, Terrassenkrater mit Zentralberg, Auswurfdecken, Alterung, helle Strahlen. Die kleinsten rechnet das Bild live, daher kein Auflösungslimit beim Zoomen.","Thousands of craters of all sizes: bowls, terraced craters with central peaks, ejecta blankets, ageing, bright rays. The smallest ones are computed live, so zooming has no resolution limit."],par:[P("dichte","Dichte","Density",0,2,.01,1,"Anteil der Zellen mit Krater je Größenstufe. 1 ≈ Sättigung der Hochländer (Krater überlappen und löschen einander), 0,2 = junge Oberfläche wie Io oder Europa, 2 = vollständig zerhackt.","Fraction of cells with a crater per size step. 1 ≈ saturated highlands (craters overlap and erase each other), 0.2 = young surface like Io or Europa, 2 = completely shattered."),P("steil","Steilheit der Verteilung","Size slope",-1,2,.01,.5,"Verschiebt die Größenverteilung: positiv = mehr kleine Krater (steile Produktionsfunktion), negativ = überwiegend große. 0 = gleiche Fläche je Größenstufe (Steigung −2).","Shifts the size distribution: positive = more small craters (steep production function), negative = mostly large. 0 = equal area per size step (slope −2)."),P("gross","Größte Kraterstufe","Largest crater step",.6,8,.05,1.6,"Zellen pro Radius der gröbsten Stufe. 1,6 → größte Krater ~15° Radius; 6 → nur kleine Krater, glatte Welt.","Cells per radius of the coarsest step. 1.6 → largest craters ~15° radius; 6 → only small craters, smooth world."),P("okt","Stufen","Steps",2,16,1,12,"Anzahl der Größenstufen (jede halb so groß). Mehr Stufen kosten Rechenzeit, bringen aber feinere Krater.","Number of size steps (each half as big). More steps cost time but bring finer craters."),P("alt","Stufen vor der Flutung","Steps before flooding",0,10,1,4,"So viele der größten Stufen entstehen vor den Lavameeren (Baustein Maria): sie werden überflutet, nur ihre Ränder schauen noch heraus („Geisterkrater“). Alle kleineren sind jünger und liegen auf den Maria.","This many of the largest steps form before the lava seas (Maria block): they get flooded and only their rims poke out (“ghost craters”). All smaller ones are younger and sit on the maria."),P("tiefe","Tiefe/Durchmesser","Depth/diameter",.02,.4,.005,.2,"Verhältnis frischer, einfacher Krater: Mond 0,2; Merkur ~0,17; eisige Monde flacher (0,1), weil Eis fließt. Poröse Körper (Hyperion) schlucken mehr: 0,35.","Ratio of fresh simple craters: Moon 0.2; Mercury ~0.17; icy moons shallower (0.1) because ice flows. Porous bodies (Hyperion) swallow more: 0.35."),P("rand","Randhöhe","Rim height",0,2.5,.01,1,"Höhe des aufgeworfenen Rands (Standard 4 % des Durchmessers). 0 = Krater ohne Wall.","Height of the raised rim (default 4 % of the diameter). 0 = craters without wall."),P("ejekta","Auswurfdecke","Ejecta blanket",0,2.5,.01,1,"Dicke der Auswurfdecke außerhalb des Rands (nimmt mit x⁻³ ab, x = Abstand/Radius).","Thickness of the ejecta blanket outside the rim (falls off as x⁻³, x = distance/radius)."),P("alter","Alter / Verfall","Age / degradation",0,1,.01,.5,"Mittlere Verwitterung. 0 = alle Krater frisch und scharf; 1 = alle verflacht und rund geschliffen (Diffusion durch Mikrometeoriten, Erdbeben).","Mean degradation. 0 = all craters fresh and sharp; 1 = all softened and rounded (diffusion by micrometeorites, quakes)."),P("komplex","Übergang einfach→komplex","Simple→complex transition",.001,.1,.001,.014,"Kraterradius (im Bogenmaß) ab dem Krater flachen Boden, Terrassen und Zentralberg bekommen. Erdmond ~0,005 (15–20 km Durchmesser), Eismonde früher, kleine Körper später.","Crater radius (radians) from which craters get flat floors, terraces and central peaks. Moon ~0.005 (15–20 km diameter), icy moons earlier, small bodies later."),P("gipfel","Zentralberge","Central peaks",0,1.5,.01,.7,"Höhe des Zentralbergs (Rückfederung des Untergrunds fn kraterKap() -> i32 {
  // Stufen, deren kleinster Krater noch ≥ 3 Texel misst (der Rest kommt live im Bild)
  return i32(floor(log2(max(gtexn() / (9.4 * $krater_gross), 1.0))));
}
fn craters(s: ptr<function, Surf>, d: vec3f, k0: i32, k1: i32, lv: i32) {
  let sd = gseed();
  let fm = (*s).form;
  var h = (*s).h;
  var fresh = (*s).fresh;
  var ray = (*s).ray;
  var cavAll = (*s).cav;
  for (var k = k0; k < k1; k++) {
    let f = $krater_gross * exp2(f32(k));
    let q = d * f;
    let base = floor(q - 0.5);
    let pk = clamp($krater_dichte * 0.9 * exp2($krater_steil * 0.5 * (f32(k) - 3.0)), 0.0, 2.0);
    var hs = 0.0; var cv = 0.0; var fr = 0.0; var ry = 0.0;
    for (var m = 0; m < 2; m++) {
      let pm = clamp(pk - f32(m), 0.0, 1.0);
      if (pm <= 0.0) { break; }
      for (var c = 0; c < 8; c++) {
        let id = base + vec3f(f32(c & 1), f32((c >> 1) & 1), f32((c >> 2) & 1));
        let hv = hash33(id + vec3f(31.7 * f32(k) + sd * 0.731, 17.3 * f32(m) + 2.9, 7.1));
        if (hv.x > pm) { continue; }
        let ctr = id + 0.5 + (hv.yzx - 0.5) * 0.5;
        let rc = 0.22 + 0.26 * hash14(id, 0.37 + f32(m) + f32(k) * 1.3);
        let lc = length(ctr);
        let w = lc - f;
        if (abs(w) >= rc) { continue; }
        let r = sqrt(rc * rc - w * w);
        if (r < 0.07) { continue; }
        let cp = ctr * (f / lc);
        let dv = q - cp;
        let dd = length(dv);
        let d3 = length(q - ctr);
        var x = dd / r;
        if (x > 3.2 && d3 > 0.85) { continue; }
        let rW = r / f;
        let age = clamp(hash14(id, 1.7 + f32(m)) * (0.12 + 1.8 * $krater_alter), 0.0, 1.0);
        let cx = sstep($krater_komplex, $krater_komplex * 4.0, rW);
        let ddr = mix($krater_tiefe, $krater_tiefe * 0.32, cx);
        let dep = 2.0 * ddr * (1.0 - 0.85 * age);
        let rimH = 0.08 * $krater_rand * (1.0 - 0.9 * age);
        let rwid = 1.0 + 3.0 * age;
        if ($krater_rund > 0.0 && x < 2.0) {
          let u = dv / max(dd, 1e-4);
          x *= 1.0 + $krater_rund * (0.6 * snoise(u * 1.6 + id * 0.173) + 0.4 * cx * snoise(u * 3.1 + id * 0.311 + 7.0));
        }
        var ph = crProfile(x, dep, rimH, cx, $krater_gipfel, $krater_terrassen, rwid, 6.0);
        if (x > 1.0) { ph *= $krater_ejekta * (1.0 - sstep(0.55, 0.85, d3)); }
        hs += ph * rW;
        cv = max(cv, 1.0 - sstep(0.86, 1.0, x));
        let fa = sq2(1.0 - age);
        fr = max(fr, fa * (1.0 - sstep(1.0, 2.8, x)) * (1.0 - sstep(0.6, 0.85, d3)));
        if (lv == 1 && age < 0.4 && x > 0.95 && rW > 0.0015) {
          let te = tangents(cp / f);
          let ang = atan2(dot(dv, te[1]), dot(dv, te[0]));
          let nr = 7.0 + floor(hv.z * 9.0);
          let lane = snoise(vec3f(ang * 1.7 + hv.y * 30.0, hash13(id), 0.5));
          let pat = pow(clamp(0.5 + 0.5 * sin(ang * nr + hv.y * 40.0 + 3.0 * lane), 0.0, 1.0), 3.0);
          let fall = pow(1.0 / max(x, 1.0), 1.1);
          ry = max(ry, pat * fall * sq2(1.0 - age / 0.4) * (1.0 - sstep(0.5, 0.85, d3)) * (0.4 + 0.6 * (1.0 - sstep(0.0015, 0.02, rW))));
        }
      }
    }
    h = (h - fm) * (1.0 - $krater_loeschen * cv) + fm + hs;
    fresh = max(fresh * (1.0 - cv), fr);
    ray = max(ray * (1.0 - cv), ry);
    cavAll = max(cavAll, cv);
  }
  (*s).h = h; (*s).fresh = fresh; (*s).ray = ray; (*s).cav = cavAll;
}
fn h_krater_alt(s: ptr<function, Surf>, d: vec3f, lv: i32) {
  craters(s, d, 0, min(i32($krater_alt), min(i32($krater_okt), kraterKap() + 1)), lv);
}
fn h_krater_jung(s: ptr<function, Surf>, d: vec3f, lv: i32) {
  craters(s, d, min(i32($krater_alt), i32($krater_okt)), min(i32($krater_okt), kraterKap() + 1), lv);
}
// Live-Detail im Zeichen-Shader: die Stufen unterhalb der Kartenauflösung, solange sie größer als ~2,5 Bildpunkte sind
fn r_krater_detail(d: vec3f, foot: f32) -> Det {
  let k0 = kraterKap() + 1;
  let k1 = min(i32(floor(log2(max(0.2 / ($krater_gross * foot), 1.0)))) + 1, min(i32($krater_okt), k0 + 5));
  if (k1 <= k0) { return Det(vec3f(0.0), 1.0); }
  var s0 = surfInit(); craters(&s0, d, k0, k1, 1);
  let tg = tangents(d);
  let eps = foot * 0.5;
  var s1 = surfInit(); craters(&s1, normalize(d + tg[0] * eps), k0, k1, 0);
  var s2 = surfInit(); craters(&s2, normalize(d + tg[1] * eps), k0, k1, 0);
  let g = ((s1.h - s0.h) / eps) * tg[0] + ((s2.h - s0.h) / eps) * tg[1];
  return Det(g, 1.0 + $krater_frisch * s0.fresh + $krater_strahl * 0.8 * s0.ray);
}
fn c_krater(s: ptr<function, Surf>, d: vec3f, g: vec3f) {
  let b = 1.0 + $krater_frisch * (*s).fresh + $krater_strahl * 1.6 * (*s).ray;
  let hi = min((*s).fresh + (*s).ray * $krater_strahl, 1.0);
  (*s).col = (*s).col * b;

fn r_fontaene(ro: vec3f, rd: vec3f, tMax: f32, col0: vec3f, sun: vec3f, sunI: f32) -> vec3f {
  var col = col0;
  let tint = mix(vec3f(1.0), hsv2rgb($fontaenen_farbton / 360.0, 1.0, 1.0), $fontaenen_saett);
  let H = $fontaenen_hoehe;
  let cosg = dot(rd, sun);
  let g = $fontaenen_vorwaerts;
  let g2 = g * g;
  let ph = (1.0 - g2) / (12.566 * pow(1.0 + g2 - 2.0 * g * cosg, 1.5)) * 0.8 + 0.06;
  let n = i32($fontaenen_anz);
  for (var i = 0; i < 8; i++) {
    if (i >= n) { break; }
    let nrm = plumeSite(i);
    let c = nrm * (1.0 + H * 0.5);
    let R = H * 0.75 + $fontaenen_breite * 2.0 + 0.5 * H * $fontaenen_schirm;
    let oc = ro - c;
    let bq = dot(oc, rd);
    let disc = bq * bq - (dot(oc, oc) - R * R);
    if (disc <= 0.0) { continue; }
    let sq = sqrt(disc);
    var t0 = max(-bq - sq, 0.0);
    var t1 = -bq + sq;
    if (t0 > tMax) { continue; }
    t1 = min(t1, tMax);
    if (t1 <= t0) { continue; }
    let dtp = (t1 - t0) / 18.0;
    var acc = vec3f(0.0);
    var T = 1.0;
    let sizeVar = 0.6 + 0.8 * hash13(vec3f(f32(i), gseed(), 9.0));
    for (var k = 0; k < 18; k++) {
      let p = ro + rd * (t0 + (f32(k) + 0.5) * dtp);
      let z = dot(p, nrm) - 1.0;
      if (z < -0.002) { continue; }
      let zr = max(z, 0.0) / (H * sizeVar);
      let rho = length(p - nrm * dot(p, nrm));
      // Strahl: Kegel, Dichte fällt mit der Höhe; Schirm: Parabel ρ_env(z) = R·√(1 − z/H) gespiegelt, Dichte nahe der Hülle
      let w = $fontaenen_breite * (1.0 + 7.0 * zr);
      let jet = exp(-sq2(rho / w)) * exp(-zr * 2.2) * (1.0 - sstep(0.85, 1.0, zr));
      let envR = $fontaenen_breite + H * 0.55 * sqrt(max(zr, 0.0)) * (1.0 - sstep(0.7, 1.05, zr)) ;
      let umb = exp(-sq2((rho - envR) / (0.1 * H + $fontaenen_breite))) * (1.0 - zr * 0.5) * (1.0 - sstep(0.8, 1.1, zr)) * 0.8;
      let core = exp(-sq2(rho / ($fontaenen_breite * 1.2))) * exp(-zr * 1.4) * 1.2;
      var dens = mix(jet, max(umb, core * 0.6), $fontaenen_schirm);
      dens *= (0.8 + 0.4 * snoise(p * 90.0 + vec3f(f32(i) * 3.0, 0.0, 0.0)));
      dens *= $fontaenen_dichte;
      let ext = dens * dtp * 30.0;
      let lit = sunVisible(p, sun);
      acc += T * (1.0 - exp(-ext)) * ph * tint * sunI * lit * 4.0;
      T *= exp(-ext * 0.5);
    }
    col = col * T + acc;
  }
  return col;
}

// Live-Körnung: Rauschen unter Kartenauflösung (Steinchen, Kornglitzern), Wellenlänge ~6 Bildpunkte, Neigung ~0,14
fn r_regolith_detail(d: vec3f, foot: f32) -> Det {
  let fr = 1.0 / (foot * 6.0);
  if (foot > 0.0016) { return Det(vec3f(0.0), 1.0); }
  let n = snoiseG(d * fr + vec3f(gseed(), 3.0, 1.0));
  let n2 = snoise(d * fr * 0.37 + vec3f(1.0, gseed(), 8.0));
  let k = 1.0 - sstep(0.0006, 0.0016, foot);
  return Det(0.14 * k * $regolith_fein * (n.yzw - d * dot(n.yzw, d)) / max(length(n.yzw), 0.5), 1.0 + 0.16 * k * $regolith_fein * (n.x * 0.6 + n2 * 0.4));
}
fn c_regolith(s: ptr<function, Surf>, d: vec3f, g: vec3f) {
  let sd = gseed();
  let n1 = fbmG(d * 3.1 + vec3f(sd * 0.41, 1.0, 3.0), 5, 0.55).x;
  let n2 = snoise(d * 83.0 + vec3f(sd, 4.0, 1.0)) * 0.6 + snoise(d * 191.0 + vec3f(1.0, sd, 5.0)) * 0.4;
  var a = $regolith_hell * (1.0 + $regolith_var * 0.7 * n1) * (1.0 + $regolith_fein * 0.35 * n2);
  let base = hsv2rgb($regolith_farbton / 360.0, $regolith_saett, 1.0);
  var col = base * a / max(dot(base, vec3f(0.3, 0.55, 0.15)), 0.2);
  // Raumverwitterung: alte, ungestörte Flächen sind dunkler und röter
  let wth = $regolith_rot * clamp(0.55 + 0.9 * n1, 0.0, 1.0) * (1.0 - (*s).fresh);
  col *= vec3f(1.0 + 0.18 * wth, 1.0 - 0.04 * wth, 1.0 - 0.22 * wth) * (1.0 - 0.22 * wth);
  let slope = length(g);
  col *= 1.0 + $regolith_hang * 0.9 * sstep(0.12, 0.7, slope);
  col *= 1.0 - $regolith_hohl * 0.5 * (*s).cav * (1.0 - sstep(0.0, 0.2, slope));
  (*s).col = col;
  (*s).rough = 0.8;
}

fn c_eisfarbe(s: ptr<function, Surf>, d: vec3f, g: vec3f) {
  let sd = gseed();
  let tint = hsv2rgb($eisfarbe_farbton / 360.0, $eisfarbe_saett, 1.0);
  let n = fbmG(d * 3.7 + vec3f(sd * 0.23, 5.0, 3.0), 5, 0.55).x;
  let grain = snoise(d * 140.0 + vec3f(sd, 1.0, 2.0));
  var ice = tint * $eisfarbe_hell * (1.0 + 0.1 * n);
  // Verschmutzung: in Senken (s.low hoch) und mit Rauschen; frische Krater und steile Hänge bleiben sauber
  let dirt = clamp($eisfarbe_schmutz * (0.5 + 0.6 * n + 0.5 * ((*s).low - 0.5)) * (1.0 - 0.8 * (*s).fresh), 0.0, 1.0);
  let dirtC = vec3f(0.07, 0.055, 0.045) * 2.0 * (0.6 + 0.4 * sstep(-0.3, 0.5, snoise(d * 11.0)));
  ice = mix(ice, dirtC, dirt * 0.9);
  ice *= 1.0 + $eisfarbe_korn * 0.12 * grain;
  ice *= 1.0 + $eisfarbe_frischeis * 0.4 * (*s).fresh;
  let m = $eisfarbe_anteil;
  (*s).col = mix((*s).col, ice, m);
  (*s).gloss = mix((*s).gloss, $eisfarbe_glanz * (1.0 - 0.7 * dirt), m);
  (*s).ice = max((*s).ice, m * (1.0 - dirt));
  (*s).rough = mix((*s).rough, 0.35, m);
}

}

fn c_streifen(s: ptr<function, Surf>, d: vec3f, g: vec3f) {
  let f = $streifen_zellen;
  let q = d * f;
  let base = floor(q - 0.5);
  var m = 0.0;
  let a = radians($streifen_richtung);
  for (var c = 0; c < 8; c++) {
    let id = base + vec3f(f32(c & 1), f32((c >> 1) & 1), f32((c >> 2) & 1));
    let hv = hash33(id + vec3f(gseed() * 0.47, 41.0, 5.0));
    if (hv.x > $streifen_dichte) { continue; }
    let ctr = id + 0.5 + (hv.yzx - 0.5) * 0.6;
    let lc = length(ctr);
    if (abs(lc - f) > 0.5) { continue; }
    let v = normalize(ctr);
    let te = tangents(v);
    let wind = normalize(te[1] * cos(a) + te[0] * sin(a));
    let rel = d - v;
    let along = dot(rel, wind);
    let perp = length(rel - wind * along);
    let L = $streifen_laenge * (0.5 + hv.z);
    let w = $streifen_breite * (0.6 + hv.y * 0.8) * (1.0 + 2.0 * clamp(along / L, 0.0, 1.0));
    let fan = exp(-sq2(perp / w)) * select(0.0, exp(-along / L), along > 0.0) * sstep(-0.004, 0.004, along);
    let dot0 = exp(-sq2(length(rel) / ($streifen_breite * 0.8)));
    m = max(m, max(fan, dot0));
  }
  (*s).col *= 1.0 - $streifen_dunkel * 0.85 * m;

// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (st in [0,1]², Fläche) ohne Begrenzung.
fn cubeUV(d: vec3f) -> vec3f {
  let ad = abs(d);
  var face = 0.0; var sc = 0.0; var tc = 0.0; var ma = 1.0;

    if (d.x > 0.0) { face = 0.0; sc = -d.z; } else { face = 1.0; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2.0; tc = d.z; } else { face = 3.0; tc = -d.z; }

fn loadDir(t: texture_2d_array<f32>, s: sampler, q: vec3f) -> vec4f {

fn sampleCube(t: texture_2d_array<f32>, s: sampler, p: vec3f) -> vec4f {

  let x = u.xy * n - 0.5;

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;

fn hash3(i: vec3f) -> vec3f {

  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;

fn rand4(a: u32, b: u32) -> vec4f {

  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);

  let gb = hash3(i + vec3f(1.0, 0.0, 0.0));
  let gc = hash3(i + vec3f(0.0, 1.0, 0.0));
  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));
  let ge = hash3(i + vec3f(0.0, 0.0, 1.0));
  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));
  let gg = hash3(i + vec3f(0.0, 1.0, 1.0));
  let gh = hash3(i + vec3f(1.0, 1.0, 1.0));

  let va = dot(ga, f - vec3f(0.0, 0.0, 0.0));
  let vb = dot(gb, f - vec3f(1.0, 0.0, 0.0));
  let vc = dot(gc, f - vec3f(0.0, 1.0, 0.0));
  let vd = dot(gd, f - vec3f(1.0, 1.0, 0.0));
  let ve = dot(ge, f - vec3f(0.0, 0.0, 1.0));
  let vf = dot(gf, f - vec3f(1.0, 0.0, 1.0));
  let vg = dot(gg, f - vec3f(0.0, 1.0, 1.0));
  let vh = dot(gh, f - vec3f(1.0, 1.0, 1.0));

  let k2 = vc - va;
  let k3 = ve - va;
  let k4 = va - vb - vc + vd;
  let k5 = va - vc - ve + vg;
  let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;

  let value = k0 + u.x * k1 + u.y * k2 + u.z * k3 + u.x * u.y * k4 + u.y * u.z * k5
            + u.z * u.x * k6 + u.x * u.y * u.z * k7;

  let grad = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga)

  return vec4f(value, grad);
}

fn curlOnSphere(p: vec3f, freq: f32, t: f32, octaves: i32) -> vec3f {

fn stormW(i: u32) -> f32 { return S.stormWeight[i / 4u][i % 4u]; }

// Drehfeld der angetriebenen Stürme: Rotation um das Zentrum, Gauß-Profil.
fn stormFlow(p: vec3f) -> vec3f {

}

// scale: Maskenradius relativ zum Sturmradius
fn stormMask(p: vec3f, scale: f32) -> vec4f {

// Stable Fluids (Stam 1999) auf der Kugel.
// Ablauf pro Schritt: advect -> curl -> zonalClear/zonalSum -> forces -> divergence -> jacobi×K -> project.
//
// Ableitungen: Nachbarn sind die echten Nachbarzellen des Würfelgitters. Ihre Richtungen
// kommen aus der Flächenparametrisierung (auch über die Flächenkante hinaus, dann landet
// die Abtastung nahtlos auf der Nachbarfläche). Weil die Zellen des Würfelgitters nicht
// gleich groß und nicht rechtwinklig sind, wird der Gradient aus einem 2×2-System mit den
// tatsächlichen Abstandsvektoren gelöst. Der Laplace-Operator für den Druck ist kompakt
// (direkte Nachbarn, wie in GPU Gems 38) und dämpft dadurch Zickzack-Moden in Gittergröße.

@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var srcA: texture_cube<f32>;
@group(0) @binding(3) var srcB: texture_cube<f32>;
@group(0) @binding(4) var dst: texture_storage_2d_array<rgba16float, write>;

@group(0) @binding(5) var<storage, read_write> zonal: array<atomic<i32>>;

const ZBINS = 128u;
const ZSCALE = 10000.0;

// Gleiche Felder als 2D-Array, für die nahtlos exakte Abtastung.
@group(0) @binding(6) var arrA: texture_2d_array<f32>;
@group(0) @binding(7) var arrB: texture_2d_array<f32>;
// SEAMLESS = true: an Würfelkanten die vier Nachbartexel einzeln holen (sampleCube in common.wgsl).
// Nötig nur auf Grafikkarten, deren Cubemap-Abtastung nicht nahtlos filtert; der Selbsttest
// im Abschnitt „Diagnose“ misst das. Sonst schnelle Hardware-Abtastung.
override SEAMLESS: bool = false;
fn A(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrA, samp, d); }
  return textureSampleLevel(srcA, samp, d, 0.0);
}
fn B(d: vec3f) -> vec4f {
  if (SEAMLESS) { return sampleCube(arrB, samp, d); }
  return textureSampleLevel(srcB, samp, d, 0.0);
}

fn outside(id: vec3u) -> bool { return f32(id.x) >= S.velN || f32(id.y) >= S.velN; }

fn put(id: vec3u, v: vec4f) { textureStore(dst, id.xy, id.z, v); }

fn safe(v: vec3f) -> vec3f {
  // NaN/Inf-Schutz und Obergrenze für die Geschwindigkeit (rad/s).
  if (any(v != v) || any(abs(v) > vec3f(1e4))) { return vec3f(0.0); }
  let l = length(v);
  return select(v, v * (1.5 / l), l > 1.5);
}

// Zelle mit ihren vier Gitternachbarn und einer lokalen Orthonormalbasis.
struct Cell {
  p: vec3f,
  pE: vec3f, pW: vec3f, pN: vec3f, pS: vec3f,
  e1: vec3f, e2: vec3f,
  inv: mat2x2f,     // bildet (fE−fW, fN−fS) auf den Gradienten (in e1/e2) ab
  ax: f32, ay: f32, // 1/Abstand² für den Laplace-Operator
  size: f32,        // mittlere Zellgröße (rad)
};

fn cell(id: vec3u) -> Cell {
  let n = S.velN;
  let st = (vec2f(id.xy) + 0.5) / n;
  let d = 1.0 / n;
  var c: Cell;
  c.p = faceDir(id.z, st);
  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));
  let dA = c.pE - c.pW;
  let dB = c.pN - c.pS;
  c.e1 = normalize(tangent(c.p, dA));
  c.e2 = cross(c.p, c.e1);
  // Zeilen: dA und dB in der lokalen Basis. Gradient g erfüllt M·g = (fE−fW, fN−fS).
  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  let det = a * dd - b * cc;
  // Inverse von [[a, b], [cc, dd]] (WGSL-Matrizen sind spaltenweise).
  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / det);
  let hx = length(dA) * 0.5;
  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);
  return c;
}

fn grad2(c: Cell, dfA: f32, dfB: f32) -> vec2f { return c.inv * vec2f(dfA, dfB); }

fn toBody(v: vec3f) -> vec3f { return vec3f(dot(U.body0.xyz, v), dot(U.body1.xyz, v), dot(U.body2.xyz, v)); }

fn hash21(p: vec2f) -> f32 {

  q += dot(q, q + 45.32);
  return fract(q.x * q.y);

fn tangentBasis(p: vec3f) -> mat2x3f {

  let e1 = normalize(cross(helper, p));
  return mat2x3f(e1, cross(p, e1));

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);

fn hitPlanet(o: vec3f, d: vec3f) -> f32 {
  let c = 1.0 - U.p0.x;

  let a = dot(ds, ds);
  let b = dot(os, ds);
  let k = dot(os, os) - 1.0;
  let disc = b * b - a * k;
  if (disc < 0.0) { return -1.0; }
  let t = (-b - sqrt(disc)) / a;
  return select(-1.0, t, t > 0.0);

        <p id="load-note"></p>
      </div>
    </div>
    <div id="toolbar"></div>
    <div id="status" hidden></div>
  </div>
  <aside id="panel">
    <div class="panel-head"><button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body"><span id="panel-title">Controls</span> <span aria-hidden="true">▴</span></button><nav id="ptype" class="seg"></nav><button id="lang" type="button">DE</button></div>
    <div id="panel-body"></div>
    <p class="credits" id="credits"></p>
  </aside>
</div>
<script>
  (function () {
    var aside = document.getElementById('panel');
    var btn = document.getElementById('panel-toggle');
    btn.addEventListener('click', function () {
      var open = aside.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('[aria-hidden]').textContent = open ? '▾' : '▴';
    });
  })();
</script>
</body>
</html>
