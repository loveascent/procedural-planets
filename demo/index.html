ucht. Höher = mehr, auch kleinere Flüsse.","How much catchment a river needs. Higher = more rivers, including smaller ones.")},{k:"craterFill",mode:"plus",type:"select",label:o("Kraterfüllung","Crater fill"),opts:[[1,o("Kratersee (bei „eingegraben“)","Crater lake (with “carved”)")],[0,o("leer","empty")]],help:o("Was in Vulkankratern steht. Der Krater ist eine echte Senke; ob Wasser darin steht, entscheidet die Seen-Berechnung.","What fills volcano craters. The crater is a real sink; whether water stands in it is decided by the lake computation.")},{k:"erosion",mode:"plus",min:0,max:3,step:.01,label:o("Erosion","Erosion"),regen:!0,help:o("Rinnen und Grate, die hangabwärts laufen und sich verzweigen, wie von Regen ausgewaschen. Formel von Clay John / Fewes (2D), hier auf die Kugel übertragen.","Gullies and ridges that run downhill and branch, as if washed out by rain. Formula by Clay John / Fewes (2D), carried over to the sphere here."),fx:"Δh = −½D·Σᵢ aᵢ(1 − Σ_c w_c cos 2π(q−c)·(r̂×∇h)),  aᵢ = 2⁻ⁱ"},{k:"terrace",mode:"plus",min:0,max:1,step:.01,label:o("Terrassen","Terraces"),help:o("Gesteinsschichten als Stufen, bewusst und glatt statt als 8-Bit-Treppe wie im Original.","Rock strata as steps, deliberate and smooth instead of the original's 8-bit staircase."),fx:"h′ = s + Δ(⌊x⌋ + smoothstep(½−w, ½+w, x−⌊x⌋)),  x = (h−s)/Δ"},{k:"detail",mode:"plus",min:0,max:2.5,step:.01,label:o("Feindetail","Fine detail"),help:o("Weitere Oktaven, live im Pixel gerechnet: beim Heranzoomen wird die Oberfläche immer feiner, ohne Pixelblöcke.","More octaves computed live per pixel: zooming in keeps adding detail, without pixel blocks."),fx:"Σ_{f > N/2π} snoise(f·p)·A/f,  "+o("ausgeblendet unter 3 px","faded below 3 px")},{k:"shadows",mode:"plus",min:0,max:1,step:.01,label:o("Geländeschatten","Terrain shadows"),help:o("Berge werfen Schatten, bei flacher Sonne lang. Der Strahl zur Sonne wird über die Höhenkarte verfolgt.","Mountains cast shadows, long at low sun. The ray to the sun is traced over the height map."),fx:o("Schatten, wenn z(q) > z₀ + s·tan ε + s²/2","shadow if z(q) > z₀ + s·tan ε + s²/2")}]},{id:"material",title:"Material",items:[{k:"rough",mode:"orig",min:0,max:1,step:.01,label:"roughness",help:o("Wie im Original. Die Rauigkeits-Karte (Land hoch, Wasser niedrig) wird damit multipliziert.","As in the original. The roughness map (land high, water low) is multiplied by it."),fx:"α = (roughness·map)²,  D_GGX = α²/(π((n·h)²(α²−1)+1)²)"},{k:"metal",mode:"orig",min:0,max:1,step:.01,label:"metalness",help:o("Wie im Original: dieselbe Karte dient auch als Metall-Karte. Deshalb glänzt das Land dort metallisch.","As in the original: the same map also serves as metalness map. That is why the land has a metallic sheen."),fx:"F₀ = mix(0,04; Albedo; metalness·map)"},{k:"gloss",mode:"plus",min:0,max:1,step:.01,label:o("Glanz (Land)","Gloss (land)"),help:o("Glanzlichter auf Fels und Hängen. Wasser glänzt immer nach seiner eigenen Physik.","Highlights on rock and slopes. Water always shines by its own physics."),fx:"α_Land = α_Material·(1 − 0,55·Glanz)"}]},{id:"light",title:o("Licht","Lighting"),items:[{k:"sunAz",min:-180,max:180,step:1,label:o("Sonne: Richtung","Sun: direction"),fmt:e=>`${Math.round(e)}°`,help:o("Seitliches Licht zeigt das Relief am stärksten. Der Planet dreht sich, die Sonne steht fest.","Side light shows the relief best. The planet turns, the sun stays fixed.")},{k:"sunEl",min:-60,max:60,step:1,label:o("Sonne: Höhe","Sun: height"),fmt:e=>`${Math.round(e)}°`},{k:"sunI",mode:"orig",min:0,max:4,step:.01,label:o("Sonnenlicht","Sun light"),help:o("Wie im Original (Lighting).","As in the original (Lighting).")},{k:"ambient",mode:"orig",min:0,max:1,step:.01,label:o("Umgebungslicht","Ambient light"),help:o("Wie im Original (Lighting): hellt auch die Nachtseite auf.","As in the original (Lighting): also lights the night side.")},{k:"exposure",mode:"plus",min:.2,max:3,step:.01,label:o("Belichtung","Exposure"),help:o("Kamera-Belichtung. Danach A : Fresnel-Leuchtsaum um den Planeten.","As in the original: Fresnel glow around the planet."),fx:"I = (c − n·v)^p"},{k:"atmo",mode:"plus",min:0,max:3,step:.01,label:o("Luftdichte","Air density"),help:o("Rayleigh-Streuung: kurzes Blau streut stärker, deshalb der blaue Rand und die rötliche Tag-Nacht-Grenze.","Rayleigh scattering: short blue scatters more, hence the blue limb and the reddish terminator."),fx:"β_R = (5,8; 13,6; 33,1)·10⁻⁶ m⁻¹,  P_R = 3/(16π)·(1 + cos²θ)"},{k:"thick",mode:"plus",min:1,max:6,step:.01,label:o("Schichtdicke","Layer thickness"),fmt:e=>`×${e.toFixed(1)}`,help:o("Überhöhung der Lufthülle für die Sichtbarkeit. ×1 ist die echte Erde (8 km Skalenhöhe).","Exaggeration of the air layer for visibility. ×1 is the real Earth (8 km scale height).")},{k:"haze",mode:"plus",min:0,max:4,step:.01,label:o("Dunst","Haze"),help:o("Mie-Streuung an Staub und Tröpfchen: heller Schein, wenn die Sonne hinter dem Planeten steht.","Mie scattering by dust and droplets: bright halo when the sun is behind the planet."),fx:"P_M = 3/(8π)·(1−g²)(1+cos²θ)/((2+g²)(1+g²−2g cos θ)^1,5), g = 0,8"}]},{id:"env",title:o("Umgebung","Environment"),items:[{k:"nebula",min:0,max:3,step:.01,label:o("Milchstraße","Milky Way"),help:o("Hintergrund wie am echten Nachthimmel: helles Band mit Kern, dunkle Staubbahnen, wenige rote Gaswolken, im Band mehr Sterne. Er steht fest und dreht sich nicht mit dem Planeten.","Background as in the real night sky: bright band with a core, dark dust lanes, a few red gas clouds, more stars in the band. It stays fixed and does not spin with the planet.")},{k:"mwWidth",min:.3,max:3,step:.01,label:o("Bandbreite","Band width"),regen:"sky",help:o("Wie breit das Milchstraßenband ist. Wir sehen die Scheibe der Galaxie von innen, als Band über den Himmel.","How wide the Milky Way band is. We see the disk of the galaxy from inside, as a band across the sky."),fx:"I ∝ exp(−(b/0,16·w)²)"},{k:"mwCore",min:0,max:3,step:.01,label:o("Kern","Core"),regen:"sky",help:o("Helligkeit des Zentrums der Galaxie (Bulge): warm-gelblich, weil dort alte Sterne stehen.","Brightness of the galactic centre (bulge): warm yellowish, because old stars live there.")},{k:"mwDust",min:0,max:2,step:.01,label:o("Staubbahnen","Dust lanes"),regen:"sky",help:o("Dunkle Staubwolken in der Mittelebene schlucken das Sternlicht, wie der „Große Riss“ am echten Himmel.","Dark dust clouds in the mid-plane swallow starlight, like the Great Rift in the real sky.")},{k:"mwHii",min:0,max:3,step:.01,label:o("Rote Gaswolken","Red gas clouds"),regen:"sky",help:o("Leuchtender Wasserstoff (H-alpha) um junge Sterne, klein und selten, nur im Band.","Glowing hydrogen (H-alpha) around young stars, small and rare, only in the band.")},{k:"stars",min:0,max:3,step:.01,label:o("Sterne","Stars")},{k:"flare",min:0,max:2,step:.01,label:o("Blendenflecke","Lens flare")},{k:"bloom",mode:"plus",min:0,max:2,step:.01,label:o("Überstrahlung","Bloom"),help:o("Helles Glitzern und die Sonne strahlen weich über, wie bei einer echten Linse.","Bright glints and the sun bleed softly, as in a real lens.")}]},{id:"modules",title:o("Module an/aus","Modules on/off"),items:[{k:"profile",type:"select",label:o("Profil","Profile"),opts:[["full",o("alles wie eingestellt","everything as set")],["minimal",o("Minimal: wie das Original, mit Bugfixes","Minimal: like the original, with bug fixes")]],help:o("Minimal schaltet alle Extras ab: Wolken, Streuung, Geländeschatten, Überstrahlung, Blendenflecke, Vulkane, Flüsse, Feindetail. Bleiben: Gelände mit Kantenfix, Meer mit den Glitzer-Korrekturen, Auflösung höchstens 100 %. Zum Vergleich der Bildrate.","Minimal turns all extras off: clouds, scattering, terrain shadows, bloom, lens flare, volcanoes, rivers, fine detail. Kept: terrain with the edge fix, sea with the glint fixes, resolution at most 100 %. For comparing frame rate.")},{k:"modWaves",type:"check",label:o("Wellen","Waves"),help:o("Wellen und Glitzer auf dem Meer. Aus = Wellenrechnung läuft gar nicht; so siehst du an der Bildzeit, was sie kostet.","Waves and glint on the sea. Off = wave code does not run at all; the frame time shows what it costs.")},{k:"modClouds",type:"check",label:o("Wolken","Clouds"),help:o("Ganzes Modul ein- oder ausschalten, zum Vergleichen.","Switch the whole module on or off, to compare.")},{k:"modAtmo",mode:"plus",type:"check",label:o("Atmosphäre (Streuung)","Atmosphere (scattering)")},{k:"modRim",type:"check",label:o("Atmosphäre (Saum wie Gasriese)","Atmosphere (rim as gas giant)"),help:o("Der Leuchtsaum des Gasriesen, 1:1 übernommen: Saum außerhalb der Scheibe und Schimmer am Rand. Geht allein oder zusätzlich zur Streuung.","The gas giant’s glow rim, taken over 1:1: halo outside the disc and shimmer at the edge. Works alone or on top of scattering.")},{k:"rimStr",min:0,max:2,step:.01,label:o("Saum-Stärke","Rim strength")},{k:"modShadows",mode:"plus",type:"check",label:o("Geländeschatten","Terrain shadows")},{k:"modBloom",mode:"plus",type:"check",label:o("Überstrahlung","Bloom")},{k:"modFlare",type:"check",label:o("Blendenflecke","Lens flare")},{k:"modWaterBody",mode:"plus",type:"check",label:o("Wasserfarbe (Tiefe, Schelf)","Water colour (depth, shelf)")},{k:"modIce",mode:"plus",type:"check",label:o("Meereis an den Polen","Polar sea ice")},{k:"modCavity",mode:"plus",type:"check",label:o("Kavität (Täler dunkler)","Cavity (darker valleys)")},{k:"modMountains",mode:"plus",type:"check",label:o("Gebirgsgürtel","Mountain belts")},{k:"modSun",type:"check",label:o("Sonne im Hintergrund (Scheibe, Korona)","Sun in the background (disc, corona)")}]},{id:"motion",title:o("Drehung & Kamera","Spin & camera"),items:[{k:"rotate",type:"check",label:o("Drehen","Rotate")},{k:"spinZoom",min:0,max:3,step:.05,label:o("Drehung beim Zoomen bremsen","Slow spin when zoomed"),fmt:e=>e.toFixed(2),help:o("Je näher du am Boden bist, desto langsamer dreht sich der Planet. 0 = immer gleich schnell, 1 = proportional zur Höhe, höher = stärker gebremst.","The closer you are lowers the render resolution when the GPU cannot keep up and raises it again when there is headroom.")},{k:"msaa",type:"select",label:o("Kantenglättung (MSAA)","Anti-aliasing (MSAA)"),opts:[[1,o("aus (wie v23, schneller)","off (as in v23, faster)")],[4,o("4× (v24, glatter, kostet FPS)","4× (v24, smoother, costs fps)")]],help:o("Glättet Planetenrand und Bergsilhouetten. Kostet viel Leistung, besonders mit hoher Bildauflösung. Umschalten lädt die Seite neu.","Smooths the planet limb and mountain silhouettes. Costs a lot of performance, especially at high render resolution. Switching reloads the page.")},{k:"frustum",type:"check",label:o("Nur Sichtbares zeichnen (Frustum-Culling)","Draw only what is visible (frustum culling)"),help:o("Gelände-Kacheln außerhalb des Bildausschnitts werden samt Unterkacheln übersprungen (CDLOD, Strugar 2009; Ebenen nach Gribb & Hartmann). Spart vor allem in Bodennähe, wo die Hälfte der Kacheln hinter der Kamera liegt.","Terrain tiles outside the view are skipped with all their children (CDLOD, Strugar 2009; planes after Gribb & Hartmann). Saves most near the ground, where half the tiles lie behind the camera.")},{k:"boden",type:"check",label:o("Bodennähe: Zoom bis Augenhöhe","Ground level: zoom down to eye height"),help:o("Zoom bis auf das Gelände. Dafür: umgekehrte Gleitkomma-Tiefe (kein Flackern bei winziger naher Ebene), Orte relativ zur Kamera (kein Zittern), tiefere Kacheln und die Feindetail-Oktaven auch im Netz. Rechte Maustaste oder Umschalt + Ziehen: umsehen.","Zoom right down to the terrain. Uses reversed floating-point depth (no z-fighting with a tiny near plane), camera-relative positions (no jitter), deeper tiles and the fine-detail octaves in the mesh too. Right mouse button or Shift + drag: look around.")},{k:"nahOkt",type:"check",label:o("Bodennähe: Nah-Oktaven (bis unter 1 m)","Ground level: near octaves (below 1 m)"),help:o("Bis zu 12 weitere Rauschstufen unter der Kartenauflösung, im Netz und im Licht. Gerechnet relativ zur Kamera auf einem Ganzzahl-Gitter, damit sie in einfacher Genauigkeit nicht stufig werden. Weit weg blendet die Pixelgröße sie aus.","Up to 12 more noise octaves below map resolution, in mesh and shading. Computed relative to the camera on an integer lattice so they do not become blocky in single precision. Far away the pixel size fades them out.")},{k:"bodenTiefe",type:"range",label:o("Bodennähe: tiefste Kachelstufe","Ground level: deepest tile level"),min:8,max:22,step:1,help:o("Wie oft eine Würfelseite höchstens geviertelt wird. 20 ≈ 0,3 m Punktabstand bei Erdgröße. Mehr = feiner am Boden, mehr Kacheln.","How many times a cube face is quartered at most. 20 ≈ 0.3 m vertex spacing at Earth size. More = finer near the ground, more tiles.")},{k:"radiusKm",type:"range",label:o("Bodennähe: Planetenradius (km)","Ground level: planet radius (km)"),min:500,max:2e4,step:1,help:o("Nur für den Maßstab am Boden: Augenhöhe und Gras werden in Metern angegeben. Erde: 6371 km.","Only for the scale at ground level: eye height and grass are given in metres. Earth: 6371 km.")},{k:"augeM",type:"range",label:o("Bodennähe: Augenhöhe (m)","Ground level: eye height (m)"),min:.3,max:100,step:.1,help:o("Wie tief die Kamera über dem Gelände höchstens kommt.","How close the camera may get to the terrain.")},{k:"spieler",type:"check",label:o("Bodennähe: Spielball (WASD, Leertaste)","Ground level: player ball (WASD, space)"),help:o("Ein Ball auf dem Gelände unter der Kamera, Kamera in 3. Person. W/A/S/D gehen (6 m/s, Umschalt 12 m/s), Leertaste springt, im Wasser schwimmt der Ball. Maus ziehen dreht den Kurs, Mausrad: Abstand 2–20 m. Taste B schaltet ein und aus. Das Gras weicht aus.","A ball on the terrain under the camera, third-person camera. W/A/S/D move (6 m/s, Shift 12 m/s), space jumps, the ball floats on water. Drag the mouse to turn, wheel: distance 2–20 m. Key B toggles. The grass makes way.")},{k:"gras",type:"check",label:o("Bodennähe: Gras","Ground level: grass"),help:o("Einzelne Grashalme um die Kamera (Halm-Formel aus GrassGPU: Büschel, Böen, Gegenlicht, Ausdünnen bis 98 m). Wächst nur, wo die erdähnliche Biomformel Gras ergibt (warm, feucht genug, flach, kein Strand).","Individual grass blades around the camera (blade formula from GrassGPU: tufts, gusts, backlight, thinning out to 98 m). Grows only where the Earth-like biome formula gives grass (warm, moist enough, flat, no beach).")},{k:"grasSicht",type:"range",label:o("Gras: Sichtweite (m)","Grass: view distance (m)"),min:10,max:50,step:1,help:o("Halbe Kantenlänge des Halmfelds (höchstens 768 × 768 Zellen). Ab 22 m dünnen die Halme aus, ab 80 m werden sie kürzer, bei 98 m enden sie (wie GrassGPU).","Half edge length of the blade field (at most 768 × 768 cells). From 22 m blades thin out, from 80 m they shrink, at 98 m they end (as in GrassGPU).")},{k:"grasLicht",type:"range",label:o("Gras: Licht","Grass: light"),min:.5,max:3,step:.05,help:o("Helligkeit von Sonne und Himmel auf den Halmen. 1,6 = gemessen gegen die Vergleichsfotos (Helligkeit 0,27–0,46).","Brightness of sun and sky on the blades. 1.6 = measured against the reference photos (brightness 0.27–0.46).")},{k:"grasGlanz",type:"range",label:o("Gras: Glanz","Grass: sheen"),min:0,max:2,step:.05,help:o("Spiegelnde Glanzlichter auf den Halmen (GrassGPU: 0,12). Mehr = silbriger Wind-Schimmer wie im Foto.","Specular highlights on the blades (GrassGPU: 0.12). More = silvery wind sheen as in the photo.")},{k:"grasAbstand",type:"range",label:o("Gras: Halmabstand (m)","Grass: blade spacing (m)"),min:.08,max:.5,step:.01,help:o("Zellgröße; je Zelle ein Halm. Kleiner = dichter (GrassGPU: 0,13 m).","Cell size; one blade per cell. Smaller = denser (GrassGPU: 0.13 m).")}]},{id:"debug",title:"Debug",items:[{k:"view",type:"select",label:o("Anzeige","Display"),opts:[[0,o("Farbe","Colour")],[1,o("Höhe","Height")],[2,o("Feuchte","Moisture")],[3,o("Normalen","Normals")],[4,o("Rauigkeit","Roughness")],[5,o("Albedo","Albedo")],[6,o("Flüsse & Seen (Ei // Profil in t = r/R (R = Kraterradius): Rückgabe (Höhe in Radien, d/dt)
fn kraterProfil(t: f32, dRad: f32, rimRad: f32, komplex: f32, peak: f32) -> vec2f {
  var h = 0.0;
  var dh = 0.0;
  if (t < 1.0) {
    // Schüssel (einfach: Parabel, komplex: breiter flacher Boden mit steilem Wandanstieg)
    let t0 = 0.55 * komplex;
    let u = clamp((t - t0) / (1.0 - t0), 0.0, 1.0);
    let w = u * u * (3.0 - 2.0 * u);
    let wq = mix(t * t, w, komplex);
    h = -dRad * (1.0 - wq);
    let dwq = mix(2.0 * t, 6.0 * u * (1.0 - u) / (1.0 - t0) * select(0.0, 1.0, t > t0), komplex);
    dh = dRad * dwq;
    // Zentralberg (nur komplexe Krater): Glockenform, Höhe ≈ 0,3 d
    let pk = komplex * peak * dRad * 0.3;
    let e = exp(-(t * t) / 0.045);
    h += pk * e;
    dh += pk * e * (-2.0 * t / 0.045);
    // Rand: scharfer Wulst bei t = 1
    let rw = 0.11;
    let er = exp(-((t - 1.0) * (t - 1.0)) / (rw * rw));
    h += rimRad * er;
    dh += rimRad * er * (-2.0 * (t - 1.0) / (rw * rw));
  } else {
    // Auswurfdecke: fällt ~ t^-3 ab, endet bei t = 1,3
    let fade = 1.0 - smoothstep(1.0, 1.3, t);
    let s = pow(1.0 / t, 3.0);
    h = rimRad * s * fade;
    dh = rimRad * (-3.0 * s / t) * fade - rimRad * s * (6.0 * (t - 1.0) * (1.3 - t) / 0.027) * select(0.0, 1.0, t < 1.3);
  }
  return vec2f(h, dh);
}

fn kraterAlle(d: vec3f, dens: f32, seed: f32) -> vec4f {
  var o = vec4f(0.0);
  var frq = 3.0;
  for (var k = 0; k < 8; k++) {
    let q = d * frq;
    let base = floor(q - 0.5);
    let pk = clamp(dens * 2.2 * pow(1.2, f32(k)), 0.0, 1.0);
    for (var c = 0; c < 8; c++) {
      let id = base + vec3f(f32(c & 1), f32((c >> 1) & 1), f32((c >> 2) & 1));
      let hv = hash33(id + vec3f(31.7 * f32(k) + seed * 0.0071, 17.3, 7.1));
      if (hv.x > pk) { continue; }
      let ctr = id + 0.5 + (hv.yzx - 0.5) * 0.5;
      let rc = 0.17 + 0.22 * hash13(id * 1.7 + vec3f(f32(k), 4.0, 2.0));
      let lc = length(ctr);
      let w = lc - frq;
      if (abs(w) >= rc) { continue; }
      let rq = sqrt(rc * rc - w * w);                  // Radius des Schnitts mit der Kugelschale
      let cc = ctr / lc;                                // Mittelpunkt auf der Einheitskugel
      let dv = d - cc;
      let r = length(dv);
      let R = rq / frq;                                 // Kraterradius in Kugelradien
      let t = r / R;
      if (t >= 1.3) { continue; }
      let Dkm = 2.0 * R * MOND_KM;
      // Tiefengesetze des Mondes
      let dSimple = 0.196 * Dkm;
      let dComplex = 1.044 * pow(Dkm, 0.301);
      let komplex = smoothstep(11.0, 22.0, Dkm);
      let dKm = mix(dSimple, dComplex, komplex);
      let rimKm = 0.036 * pow(Dkm, 0.399);
      // Verfall: Bodenkriechen ~ 1/D², dazu zufälliges Alter
      let age = clamp(hash13(id * 0.77 + vec3f(5.0, f32(k), 1.0)) * 0.8 + clamp(0.3 * log2(30.0 / max(Dkm, 0.5)), 0.0, 0.9), 0.0, 1.0);
      let keep = 1.0 - 0.85 * age;
      let dRad = dKm / MOND_KM * keep;
      let rimRad = rimKm / MOND_KM * (1.0 - 0.9 * age);
      let P = kraterProfil(t, dRad, rimRad, komplex, step(0.5, hash13(id * 3.1 + 1.0)));
      let dir = dv / max(r, 1e-6);
      o += vec4f(P.x / REL_E, (P.y / R / REL_E) * dir);
    }
    frq *= 2.0;
  }
  return o;
}

fn hook_vulkan_hoehe(d: vec3f, dens: f32, seed: f32, sup: f32) -> vec4f { return kraterAlle(d, dens, seed); }

const PI = 3.14159265359;

struct VOut { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VOut {
  let xy = vec2f(f32((i << 1u) & 2u), f32(i & 2u)) * 2.0 - 1.0;
  var o: VOut;
  o.pos = vec4f(xy, 0.0, 1.0);
  o.ndc = xy;
  return o;
}

fn toBody(v: vec3f) -> vec3f { return vec3f(dot(U.body0.xyz, v), dot(U.body1.xyz, v), dot(U.body2.xyz, v)); }

fn hash21(p: vec2f) -> f32 {
  var q = fract(p * vec2f(123.34, 456.21));
  q += dot(q, q + 45.32);
  return fract(q.x * q.y);
}

fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  return mat2x3f(e1, cross(p, e1));
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

// Ellipsoid x² + (y/c)² + z² = 1 mit c = 1 − Abplattung. Rückgabe: t oder −1.
fn hitPlanet(o: vec3f, d: vec3f) -> f32 {
  let c = 1.0 - U.p0.x;
  let s = vec3f(1.0, 1.0 / c, 1.0);
  let os = o * s; let ds = d * s;
  let a = dot(ds, ds);
  let b = dot(os, ds);
  let k = dot(os, os) - 1.0;
  let disc = b * b - a * k;
  if (disc < 0.0) { return -1.0; }
  let t = (-b - sqrt(disc)) / a;
  return select(-1.0, t, t > 0.0);
}

// ---------- Cubemap-Abbildung (WebGPU-Konvention: +X −X +Y −Y +Z −Z) ----------

fn faceDir(face: u32, st: vec2f) -> vec3f {
  let a = st.x * 2.0 - 1.0;
  let b = st.y * 2.0 - 1.0;
  switch face {
    case 0u: { return normalize(vec3f(1.0, -b, -a)); }
    case 1u: { return normalize(vec3f(-1.0, -b, a)); }
    case 2u: { return normalize(vec3f(a, 1.0, b)); }
    case 3u: { return normalize(vec3f(a, -1.0, -b)); }
    case 4u: { return normalize(vec3f(a, -b, 1.0)); }
    default: { return normalize(vec3f(-a, -b, -1.0)); }
  }
}

// Richtung -> (st in [0,1]², Fläche) ohne Begrenzung.
fn cubeUV(d: vec3f) -> vec3f {
  let ad = abs(d);
  var face = 0.0; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0.0; sc = -d.z; } else { face = 1.0; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2.0; tc = d.z; } else { face = 3.0; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4.0; sc = d.x; } else { face = 5.0; sc = -d.x; }
    tc = -d.y;
  }
  return vec3f(vec2f(sc, tc) / ma * 0.5 + 0.5, face);
}

// Nahtloses bilineares Abtasten der Würfelfelder.
// Gemessen: das Hardware-Abtasten über Würfelkanten weicht bis zu 500-mal stärker ab als im
// Flächeninneren. Weil die Farbe jeden Schritt neu abgetastet wird, wachsen daraus Narben.
// Darum: im Inneren tastet die Hardware ab (dort exakt); nahe der Kante werden die vier
// Nachbar-Texel einzeln geholt, Texel jenseits der Kante über ihre Richtung auf der Nachbarfläche.
fn loadDir(t: texture_2d_array<f32>, s: sampler, q: vec3f) -> vec4f {
  let u = cubeUV(q);
  return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
}

fn sampleCube(t: texture_2d_array<f32>, s: sampler, p: vec3f) -> vec4f {
  let n = f32(textureDimensions(t).x);
  let u = cubeUV(p);
  let x = u.xy * n - 0.5;
  if (all(x >= vec2f(0.0)) && all(x <= vec2f(n - 1.0))) {
    return textureSampleLevel(t, s, u.xy, i32(u.z), 0.0);
  }
  let i0 = floor(x);
  let f = x - i0;
  let face = u32(u.z);
  var c: array<vec4f, 4>;
  for (var k = 0u; k < 4u; k++) {
    let ij = i0 + vec2f(f32(k & 1u), f32(k >> 1u));
    if (all(ij >= vec2f(0.0)) && all(ij <= vec2f(n - 1.0))) {
      c[k] = textureLoad(t, vec2i(ij), i32(face), 0);
    } else {
      c[k] = loadDir(t, s, faceDir(face, (ij + 0.5) / n));
    }
  }
  return mix(mix(c[0], c[1], f.x), mix(c[2], c[3], f.x), f.y);
}

// Richtung -> (Fläche, Texel) für Schreibzugriffe aus Partikeln.
fn dirToTexel(d: vec3f, n: u32) -> vec3u {
  let ad = abs(d);
  var face = 0u; var sc = 0.0; var tc = 0.0; var ma = 1.0;
  if (ad.x >= ad.y && ad.x >= ad.z) {
    ma = ad.x;
    if (d.x > 0.0) { face = 0u; sc = -d.z; } else { face = 1u; sc = d.z; }
    tc = -d.y;
  } else if (ad.y >= ad.z) {
    ma = ad.y;
    if (d.y > 0.0) { face = 2u; tc = d.z; } else { face = 3u; tc = -d.z; }
    sc = d.x;
  } else {
    ma = ad.z;
    if (d.z > 0.0) { face = 4u; sc = d.x; } else { face = 5u; sc = -d.x; }
    tc = -d.y;
  }
  let st = clamp(vec2f(sc, tc) / ma * 0.5 + 0.5, vec2f(0.0), vec2f(0.99999));
  let px = vec2u(st * f32(n));
  return vec3u(px, face);
}

// Orthonormale Tangentenbasis. Die Wahl darf von Punkt zu Punkt springen,
// weil Divergenz, Laplace und Gradient unabhängig von der Basisdrehung sind.
fn tangentBasis(p: vec3f) -> mat2x3f {
  let helper = select(vec3f(1.0, 0.0, 0.0), vec3f(0.0, 1.0, 0.0), abs(p.y) < 0.9);
  let e1 = normalize(cross(helper, p));
  let e2 = cross(p, e1);
  return mat2x3f(e1, e2);
}

fn east(p: vec3f) -> vec3f {
  let e = cross(vec3f(0.0, 1.0, 0.0), p);
  let l = length(e);
  return select(vec3f(1.0, 0.0, 0.0), e / l, l > 1e-5);
}

fn latitude(p: vec3f) -> f32 { return asin(clamp(p.y, -1.0, 1.0)); }

fn stepOn(p: vec3f, v: vec3f) -> vec3f { return normalize(p + v); }

fn tangent(p: vec3f, v: vec3f) -> vec3f { return v - p * dot(p, v); }

// ---------- Tabellen ----------

fn jetAt(lat: f32) -> f32 {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  let a = S.jets[i / 4u][i % 4u];
  let b = S.jets[j / 4u][j % 4u];
  return mix(a, b, fract(x)) * S.jetStrength;
}

fn bandAt(lat: f32) -> vec3f {
  let x = clamp((lat / PI + 0.5) * 63.0, 0.0, 63.0);
  let i = u32(floor(x));
  let j = min(i + 1u, 63u);
  return mix(S.bands[i].rgb, S.bands[j].rgb, fract(x));
}

// ---------- Zufall und Rauschen ----------

fn pcg3d(v0: vec3u) -> vec3u {
  var v = v0 * 1664525u + 1013904223u;
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  v ^= v >> vec3u(16u);
  v.x += v.y * v.z; v.y += v.z * v.x; v.z += v.x * v.y;
  return v;
}

fn hash3(i: vec3f) -> vec3f {
  let h = pcg3d(bitcast<vec3u>(vec3i(i)));
  return vec3f(h) * (2.0 / 4294967295.0) - 1.0;
}

fn rand4(a: u32, b: u32) -> vec4f {
  let h = pcg3d(vec3u(a, b, 0x9e3779b9u));
  let g = pcg3d(h.zxy ^ vec3u(b, a, 7u));
  return vec4f(vec3f(h), f32(g.x)) / 4294967295.0;
}

// Gradientenrauschen mit analytischer Ableitung: x = Wert, yzw = Gradient.
fn noised(x: vec3f) -> vec4f {
  let i = floor(x);
  let f = fract(x);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);

  let ga = hash3(i + vec3f(0.0, 0.0, 0.0));
  let gb = hash3(i + vec3f(1.0, 0.0, 0.0));
  let gc = hash3(i + vec3f(0.0, 1.0, 0.0));
  let gd = hash3(i + vec3f(1.0, 1.0, 0.0));
  let ge = hash3(i + vec3f(0.0, 0.0, 1.0));
  let gf = hash3(i + vec3f(1.0, 0.0, 1.0));
  let gg = hash3(i + vec3f(0.0, 1.0, 1.0));
  let gh = hash3(i + vec3f(1.0, 1.0, 1.0));

  let va = dot(ga, f - vec3f(0.0, 0.0, 0.0));
  let vb = dot(gb, f - vec3f(1.0, 0.0, 0.0));
  let vc = dot(gc, f - vec3f(0.0, 1.0, 0.0));
  let vd = dot(gd, f - vec3f(1.0, 1.0, 0.0));
  let ve = dot(ge, f - vec3f(0.0, 0.0, 1.0));
  let vf = dot(gf, f - vec3f(1.0, 0.0, 1.0));
  let vg = dot(gg, f - vec3f(0.0, 1.0, 1.0));
  let vh = dot(gh, f - vec3f(1.0, 1.0, 1.0));

  let k0 = va;
  let k1 = vb - va;
  let k2 = vc - va;
  let k3 = ve - va;
  let k4 = va - vb - vc + vd;
  let k5 = va - vc - ve + vg;
  let k6 = va - vb - ve + vf;
  let k7 = -va + vb + vc - vd + ve - vf - vg + vh;

  let value = k0 + u.x * k1 + u.y * k2 + u.z * k3 + u.x * u.y * k4 + u.y * u.z * k5
            + u.z * u.x * k6 + u.x * u.y * u.z * k7;

  let grad = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.z * (ge - ga)
           + u.x * u.y * (ga - gb - gc + gd) + u.y * u.z * (ga - gc - ge + gg)
           + u.z * u.x * (ga - gb - ge + gf) + u.x * u.y * u.z * (-ga + gb + gc - gd + ge - gf - gg + gh)
           + du * (vec3f(k1, k2, k3) + u.yzx * vec3f(k4, k5, k6) + u.zxy * vec3f(k6, k4, k5)
                   + u.yzx * u.zxy * k7);
  return vec4f(value, grad);
}

// Divergenzfreies Rauschfeld auf der Kugel: v = p × ∇ψ (ψ = FBM-Rauschen als Stromfunktion).
fn curlOnSphere(p: vec3f, freq: f32, t: f32, octaves: i32) -> vec3f {
  var g = vec3f(0.0);
  var amp = 1.0;
  var fr = freq;
  for (var o = 0; o < octaves; o++) {
    let off = vec3f(f32(o) * 17.3, t * (1.0 + 0.37 * f32(o)), f32(o) * -9.1);
    g += noised(p * fr + off).yzw * amp * fr / freq;
    amp *= 0.5;
    fr *= 2.03;
  }
  return cross(p, g);

fn stormFlow(p: vec3f) -> vec3f {

  let n = u32(S.stormCount);

// Zelle mit ihren vier Gitternachbarn und einer lokalen Orthonormalbasis.
struct Cell {
  p: vec3f,
  pE: vec3f, pW: vec3f, pN: vec3f, pS: vec3f,
  e1: vec3f, e2: vec3f,
  inv: mat2x2f,     // bildet (fE−fW, fN−fS) auf den Gradienten (in e1/e2) ab
  ax: f32, ay: f32, // 1/Abstand² für den Laplace-Operator
  size: f32,        // mittlere Zellgröße (rad)
};

fn cell(id: vec3u) -> Cell {
  let n = S.velN;
  let st = (vec2f(id.xy) + 0.5) / n;
  let d = 1.0 / n;
  var c: Cell;
  c.p = faceDir(id.z, st);
  c.pE = faceDir(id.z, st + vec2f(d, 0.0));
  c.pW = faceDir(id.z, st - vec2f(d, 0.0));
  c.pN = faceDir(id.z, st + vec2f(0.0, d));
  c.pS = faceDir(id.z, st - vec2f(0.0, d));
  let dA = c.pE - c.pW;
  let dB = c.pN - c.pS;
  c.e1 = normalize(tangent(c.p, dA));
  c.e2 = cross(c.p, c.e1);

  let a = dot(dA, c.e1); let b = dot(dA, c.e2);
  let cc = dot(dB, c.e1); let dd = dot(dB, c.e2);
  let det = a * dd - b * cc;
  // Inverse von [[a, b], [cc, dd]] (WGSL-Matrizen sind spaltenweise).
  c.inv = mat2x2f(vec2f(dd, -cc), vec2f(-b, a)) * (1.0 / det);

  let hy = length(dB) * 0.5;
  c.ax = 1.0 / (hx * hx);
  c.ay = 1.0 / (hy * hy);
  c.size = 0.5 * (hx + hy);

<body>
<div id="app">
  <div id="stage">
    <canvas id="view" data-body="gas,rocky,moon" aria-label="Planet view: drag to turn, scroll or pinch to zoom"></canvas>
    <canvas id="welt" data-body="welt" aria-label="Solar system: drag to turn, scroll or pinch to zoom, click selects, double-click flies there"></canvas>
    <div class="hud">
      <h1 id="t-title">Procedural Planets</h1>
      <div id="planet-info" data-body="gas">Jupiter</div>
      <div class="meta" data-body="gas,rocky,moon"><span id="fps">– fps</span> <span id="version"></span></div>
      <div class="meta" id="welt-status" data-body="welt">starte …</div>
      <div class="meta" id="hint" data-body="gas">drag to rotate, scroll or pinch to zoom</div>
      <div class="meta" data-body="rocky,moon"><span id="mode-tag"></span> · <span id="t-hint"></span></div>
    </div>
    <div id="genbar" data-body="rocky,moon" hidden><span id="gen-text"></span><div class="track"><div class="fill" id="gen-fill"></div></div></div>
    <div id="loading" data-body="gas" role="status" aria-live="polite">
      <div class="load-box">
        <p id="load-title">Spinning up the atmosphere</p>
        <div class="load-track"><span id="load-bar"></span></div>
        <p id="load-note"></p>
      </div>
    </div>
    <aside id="grafik-links" data-body="gas,rocky,moon,welt" hidden>
      <div id="grafik-links-body"></div>
    </aside>
    <div id="toolbar"></div>
    <div id="status" hidden></div>
  </div>
  <aside id="panel">
    <div class="panel-head"><button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body"><span id="panel-title">Controls</span> <span aria-hidden="true">▴</span></button><nav id="ptype" class="seg"></nav><button id="lang" type="button">DE</button></div>
    <div id="panel-body"></div>
    <p class="credits" id="credits"></p>
  </aside>
</div>
<script>
  (function () {
    var aside = document.getElementById('panel');
    var btn = document.getElementById('panel-toggle');
    btn.addEventListener('click', function () {
      var open = aside.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('[aria-hidden]').textContent = open ? '▾' : '▴';
    });
  })();
</script>
</body>
