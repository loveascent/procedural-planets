<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welt – Planetensystem</title>
<style>
  :root { color-scheme: dark; --bg: #04050a; --fg: #d9deea; --dim: #8791a8; --acc: #ffb15c; --kasten: rgba(12, 15, 26, 0.86); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.35 'IBM Plex Sans', system-ui, sans-serif; overflow: hidden; }
  canvas#welt { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; left: 14px; top: 12px; pointer-events: none; text-shadow: 0 1px 4px #000; }
  .hud h1 { margin: 0; font: 600 20px 'Barlow Condensed', system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  #status { color: var(--dim); font-size: 12px; margin-top: 2px; }
  #fehler { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: var(--bg); }
  #panel { position: fixed; right: 10px; top: 10px; bottom: 10px; width: 300px; max-width: calc(100vw - 20px); overflow: auto; background: var(--kasten); border: 1px solid #2a3148; border-radius: 10px; padding: 6px 10px 12px; backdrop-filter: blur(6px); }
  #panel.zu { display: none; }
  #umschalter { position: fixed; right: 14px; bottom: 14px; z-index: 5; }
  details { border-top: 1px solid #222a40; padding: 6px 0; }
  details:first-of-type { border-top: 0; }
  summary { cursor: pointer; font-weight: 500; color: var(--acc); padding: 2px 0; }
  .z { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 5px 0; }
  .z label { flex: 1 1 100%; display: flex; justify-content: space-between; color: var(--dim); }
  .z input[type=range] { flex: 1 1 100%; accent-color: var(--acc); }
  .w { color: var(--fg); font-variant-numeric: tabular-nums; }
  button { background: #1b2238; color: var(--fg); border: 1px solid #343e5e; border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; }
  button:hover { background: #26304f; border-color: var(--acc); }
  select, input[type=number] { background: #0e1220; color: var(--fg); border: 1px solid #343e5e; border-radius: 6px; padding: 4px 6px; font: inherit; width: 100%; }
  .bs { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  .bs input { accent-color: var(--acc); }
  .info { color: var(--dim); margin-top: 6px; min-height: 2.6em; }
  .ereignisse { white-space: pre-line; color: var(--dim); font-size: 12px; margin-top: 4px; }
  .klein { color: var(--dim); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<canvas id="welt" aria-label="Planetensystem: ziehen zum Drehen, Mausrad oder Zweifingergeste zum Zoomen, Klick wählt, Doppelklick fliegt hin"></canvas>
<div class="hud"><h1>Welt · 20 Planeten</h1><div id="status">starte …</div></div>
<div id="panel"></div>
<button id="umschalter" type="button">Bedienfeld</button>
<div id="fehler"></div>
<script type="module" src="/src/welt/main.ts"></script>
</body>
</html>
