<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Procedural Planets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/src/shell.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view" aria-label="Real-time gas giant simulation"></canvas>
    <div class="hud">
      <h1>Procedural Planets</h1>
      <div id="planet-info">Jupiter</div>
      <div class="meta"><span id="fps">– fps</span> <span id="version"></span></div>
      <div class="meta" id="hint">drag to rotate, scroll or pinch to zoom</div>
    </div>
    <div id="loading" role="status" aria-live="polite">
      <div class="load-box">
        <p id="load-title">Spinning up the atmosphere</p>
        <div class="load-track"><span id="load-bar"></span></div>
        <p id="load-note"></p>
      </div>
    </div>
    <div id="toolbar"></div>
    <div id="status" hidden></div>
  </div>
  <aside id="panel">
    <div class="panel-head"><button id="panel-toggle" type="button" aria-expanded="false" aria-controls="panel-body"><span id="panel-title">Controls</span> <span aria-hidden="true">▴</span></button><nav id="ptype" class="seg"></nav><button id="lang" type="button">DE</button></div>
    <div id="panel-body"></div>
    <p class="credits" id="credits"></p>
  </aside>
</div>
<script>
  (function () {
    var aside = document.getElementById('panel');
    var btn = document.getElementById('panel-toggle');
    btn.addEventListener('click', function () {
      var open = aside.classList.toggle('open');
      btn.setAttribute('aria-expanded', String(open));
      btn.querySelector('[aria-hidden]').textContent = open ? '▾' : '▴';
    });
  })();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
